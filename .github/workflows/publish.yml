name: Publish to npm

# 触发：推送形如 v1.2.3 的 tag 时自动发布；也可在 Actions 页面手动运行。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# OIDC Trusted Publishing：npm CLI 会自动识别 GitHub Actions 的 OIDC 身份向 npm
# 认证，仓库里无需存任何 NPM_TOKEN，也就不存在 token 泄露 / 90 天过期 / OTP 的问题。
# 前提：已在 npmjs.com 该包的 Settings -> Trusted Publisher 里绑定本仓库与本文件名。
permissions:
  # contents: write 用于发布后建 GitHub Release（notes 从 CHANGELOG.md 生成）。
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing 要求 npm CLI >= 11.5.1
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # 防止 tag 与 package.json 版本不一致而发错版本
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$pkg  tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public

      # notes 从 CHANGELOG.md 的对应版本段落取；没有该段落时退回 git 自动生成，
      # 不因为缺一段文档就让发版失败。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=/tmp/release-notes.md
          sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '\$d' > "$NOTES" || true
          if [ ! -s "$NOTES" ]; then
            echo "::notice::CHANGELOG.md 中没有 $VERSION 段落，退回自动生成 notes"
            gh release create "$GITHUB_REF_NAME" --title "$VERSION" --generate-notes --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file "$NOTES" --latest
          fi
